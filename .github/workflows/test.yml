name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit and integration tests
        run: cargo test --locked
      - name: Repository server tests (TCP loopback)
        run: cargo test --locked --test repository -- --ignored
