[package]
name = "universal-prompt-language"
version = "0.1.0-rc.3"
edition = "2021"
keywords = ["prompts", "dynamic", "llm", "ai", "library"]

authors = ["David Valin <hola@davidvalin.com>"]
homepage = "https://crates.io/crates/universal-prompt-language"
repository = "https://github.com/DavidValin/universal-prompt-language"
description = "Define, Manage, Edit and Build and Store dynamic prompts using Universal Prompt Language (UPL)"
license-file = "LICENSE"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.14", features = ["serde"] }
thiserror = "2.0"
inquire = "0.7"
crossterm = "0.27"
sha2 = "0.10"
bincode = "1"
argon2 = "0.5"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
rustls-pemfile = "2"
hex = "0.4"

[dev-dependencies]

[[bin]]
name = "upl"
path = "src/main.rs"
